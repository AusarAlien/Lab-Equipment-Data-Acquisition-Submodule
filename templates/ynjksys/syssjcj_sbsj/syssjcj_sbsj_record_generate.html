{% load static %}
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>生成原始记录</title>
    <link
      rel="stylesheet"
      href="{% static 'ynjksys/syssjcj_sbsj_record_generate.css' %}?v=2026080401"
    />
    <script src="{% static 'common/isvar.js' %}"></script>
    <script src="{% static 'common/issubmit.js' %}"></script>
    <script src="{% static 'ynjksys/syssjcj_mock_data.js' %}?v=2026080404"></script>
  </head>

  <body>
    <main id="pageContent" class="page-container">
      <section class="config-panel">
        <div class="section-title">
          <span></span>
          <h1>原始记录生成信息</h1>
        </div>
        <div class="config-grid">
          <div class="form-item form-wide">
            <label for="recordName">原始记录名称</label
            ><input id="recordName" type="text" maxlength="120" />
          </div>
          <div class="info-item">
            <span>原始记录模板</span><strong id="templateName">--</strong>
          </div>
          <div class="info-item">
            <span>记录生成方式</span><strong id="recordMode">--</strong>
          </div>
          <div class="info-item">
            <span>样品类别</span><strong id="sampleCategoryName">--</strong>
          </div>
          <div class="info-item">
            <span>所属部门</span><strong id="departmentName">--</strong>
          </div>
          <div class="info-item">
            <span>仪器设备</span><strong id="deviceName">--</strong>
          </div>
          <div class="info-item">
            <span>实验时间</span><strong id="experimentRange">--</strong>
          </div>
          <div class="info-item">
            <span>数据数量</span><strong id="dataCount">--</strong>
          </div>
        </div>
      </section>
      <section class="preview-panel">
        <div class="section-title">
          <span></span>
          <h1>标准模板原始记录预览</h1>
        </div>
        <article class="record-paper">
          <header>
            <h2 id="paperTitle">原始记录</h2>
            <div class="paper-code">记录编号：系统生成</div>
          </header>
          <div class="paper-meta">
            <div>所属部门：<strong id="paperDepartment">--</strong></div>
            <div>仪器设备：<strong id="paperDevice">--</strong></div>
            <div>品牌型号：<strong id="paperModel">--</strong></div>
            <div>固定资产编号：<strong id="paperAsset">--</strong></div>
            <div>实验时间：<strong id="paperTime">--</strong></div>
            <div>记录模板：<strong id="paperTemplate">--</strong></div>
            <div>样品类别：<strong id="paperSampleCategory">--</strong></div>
          </div>
          <div class="paper-table-scroll">
            <table>
              <thead>
                <tr>
                  <th>序号</th>
                  <th>样品编号</th>
                  <th>样品类别</th>
                  <th>样品名称</th>
                  <th>检测项目</th>
                  <th>检测结果</th>
                  <th>单位</th>
                  <th>数据来源</th>
                </tr>
              </thead>
              <tbody id="previewRows"></tbody>
            </table>
          </div>
          <footer>
            <span>记录生成：监*一</span><span>生成时间：系统生成</span
            ><span>复核：________</span>
          </footer>
        </article>
      </section>
      <div class="page-actions">
        <button id="generateSubmit" class="button button-primary" type="button">
          生成原始记录
        </button>
      </div>
    </main>
    <div id="pageError" class="page-error is-hidden">
      生成数据不存在或已失效
    </div>
    <div id="workingMask" class="working-mask is-hidden">
      <div class="working-box">
        <span class="spinner"></span><strong>正在生成标准原始记录</strong>
      </div>
    </div>
    <div id="toast" class="toast is-hidden"></div>
    <script src="{% static 'ynjksys/syssjcj_sbsj_record_generate.js' %}?v=2026080404"></script>
  </body>
</html>
