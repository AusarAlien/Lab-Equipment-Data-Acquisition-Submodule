{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>实验室设备数据管理</title>
    <link rel="stylesheet" href="{% static 'ynjksys/syssjcj_sbsj_list.css' %}?v=2026080406">
    <script src="{% static 'common/isvar.js' %}"></script>
    <script src="{% static 'common/isqrydata.js' %}"></script>
    <script src="{% static 'common/issubmit.js' %}"></script>
    <script src="{% static 'common/isloadpage.js' %}"></script>
    <script src="{% static 'ynjksys/syssjcj_mock_data.js' %}?v=2026080410"></script>
</head>

<body>
    <main class="page-container">
        <nav class="business-tabs" aria-label="业务页签"><button class="business-tab is-active" data-tab="data"
                type="button">数据查询与原始记录生成</button><button class="business-tab" data-tab="records"
                type="button">查阅原始记录</button></nav>
        <section id="dataTab" class="tab-page">
            <section class="query-panel">
                <div class="query-grid">
                    <div class="form-item"><label for="sampleCategory">样品类别</label><select id="sampleCategory">
                            <option value="">全部类别</option>
                            <optgroup label="环境样品">
                                <option value="ENV-WATER-DRINKING">生活饮用水</option>
                                <option value="ENV-WATER-SURFACE">地表水</option>
                                <option value="ENV-WATER-GROUND">地下水</option>
                                <option value="ENV-AIR-WORKPLACE">工作场所空气</option>
                                <option value="ENV-AIR-AMBIENT">环境空气</option>
                                <option value="ENV-SOIL">土壤或沉积物</option>
                            </optgroup>
                            <optgroup label="食品及相关产品">
                                <option value="FOOD-GENERAL">食品</option>
                                <option value="FOOD-BEVERAGE">饮料</option>
                                <option value="FOOD-ADDITIVE">食品添加剂</option>
                                <option value="FOOD-CONTACT">食品接触材料</option>
                            </optgroup>
                            <optgroup label="生物样本">
                                <option value="BIO-SERUM">血清</option>
                                <option value="BIO-PLASMA">血浆</option>
                                <option value="BIO-WHOLE-BLOOD">全血</option>
                                <option value="BIO-URINE">尿液</option>
                                <option value="BIO-SPUTUM">痰液</option>
                                <option value="BIO-THROAT-SWAB">咽拭子</option>
                                <option value="BIO-NASAL-SWAB">鼻拭子</option>
                                <option value="BIO-FECES">粪便</option>
                                <option value="BIO-OTHER">其他人体样本</option>
                            </optgroup>
                            <optgroup label="微生物样本">
                                <option value="MICRO-CULTURE">菌株或培养物</option>
                                <option value="MICRO-VIRUS">病毒样本</option>
                                <option value="MICRO-ISOLATE">微生物分离物</option>
                            </optgroup>
                            <optgroup label="职业与放射卫生">
                                <option value="OCC-COLLECTED">职业卫生采集样品</option>
                                <option value="RAD-DOSIMETER">个人剂量计</option>
                                <option value="RAD-SAMPLE">放射性监测样品</option>
                            </optgroup>
                            <optgroup label="质量控制样品">
                                <option value="QC-REFERENCE">标准物质</option>
                                <option value="QC-CONTROL">质控样品</option>
                                <option value="QC-BLANK">空白样品</option>
                                <option value="QC-PT">能力验证样品</option>
                            </optgroup>
                            <option value="OTHER">其他样品</option>
                        </select></div>
                    <div class="form-item"><label for="departmentSelect">所属部门</label><select id="departmentSelect">
                            <option value="">全部部门</option>
                        </select></div>
                    <div class="form-item"><label for="deviceSelect">仪器设备</label><select id="deviceSelect">
                            <option value="">全部设备</option>
                        </select></div>
                    <div class="form-item"><label for="templateSelect">项目模板</label><select id="templateSelect">
                            <option value="">请选择模板</option>
                        </select></div>
                    <div id="sampleField" class="form-item"><label for="sampleKeyword">样品编号</label><input
                            id="sampleKeyword" type="text" placeholder="请输入样品编号"></div>
                    <div id="projectField" class="form-item"><label for="projectKeyword">检测项目</label><input
                            id="projectKeyword" type="text" placeholder="请输入检测项目"></div>
                    <div class="form-item date-item"><label for="startDate">实验时间</label>
                        <div class="date-range"><input id="startDate" type="date"><span>至</span><input id="endDate"
                                type="date"></div>
                    </div>
                    <div class="query-actions"><button id="queryButton" class="button button-primary"
                            type="button">查询</button><button id="resetButton" class="button button-secondary"
                            type="button">重置</button></div>
                </div>
                <div id="deviceContext" class="device-context is-hidden">
                    <div><span>品牌型号</span><strong id="contextModel">--</strong></div>
                    <div><span>固定资产编号</span><strong id="contextAsset">--</strong></div>
                    <div><span>所在位置</span><strong id="contextLocation">--</strong></div>
                    <div><span>负责人</span><strong id="contextOwner">--</strong></div>
                    <div><span>数据采集类型</span><strong id="contextCollectType">--</strong></div>
                </div>
            </section>
            <section class="list-panel">
                <div class="panel-title"><span class="title-mark"></span>
                    <h1>设备采集数据</h1><span id="dataSummary" class="result-summary"></span>
                    <div class="panel-actions"><span id="selectedSummary">已选择 0 条</span><button id="generateButton"
                            class="button button-primary" type="button" disabled>生成原始记录</button></div>
                </div>
                <div class="table-scroll">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th class="col-actions">操作</th>
                                <th class="col-check"><input id="selectAll" type="checkbox" aria-label="全选当前页"></th>
                                <th class="col-index">序号</th>
                                <th>样品编号</th>
                                <th>样品类别</th>
                                <th>样品名称</th>
                                <th>检测项目</th>
                                <th>结果摘要</th>
                                <th>单位</th>
                                <th>仪器设备</th>
                                <th>所属部门</th>
                                <th>实验时间</th>
                                <th>采集时间</th>
                                <th>来源文件</th>
                            </tr>
                        </thead>
                        <tbody id="dataRows"></tbody>
                    </table>
                    <div id="dataEmpty" class="table-state is-hidden">暂无符合条件的设备数据</div>
                </div>
                <div class="pagination"><button id="dataPrevious" class="page-button" type="button">‹</button>
                    <div id="dataPages" class="page-numbers"></div><button id="dataNext" class="page-button"
                        type="button">›</button><span id="dataPageSummary">共 0 页，10 条</span><label
                        for="dataJump">跳至</label><input id="dataJump" class="jump-input" type="number"
                        min="1"><span>页</span>
                </div>
            </section>
        </section>
        <section id="recordsTab" class="tab-page is-hidden">
            <section class="query-panel">
                <div class="record-query-grid">
                    <div class="form-item"><label for="recordTemplate">记录模板</label><select id="recordTemplate">
                            <option value="">全部模板</option>
                        </select></div>
                    <div class="form-item date-item"><label for="recordStart">生成时间</label>
                        <div class="date-range"><input id="recordStart" type="date"><span>至</span><input id="recordEnd"
                                type="date"></div>
                    </div>
                    <div class="query-actions"><button id="recordResetButton" class="button button-secondary"
                            type="button">重置</button></div>
                </div>
            </section>
            <section class="list-panel">
                <div class="panel-title"><span class="title-mark"></span>
                    <h1>原始记录列表</h1><span id="recordSummary" class="result-summary"></span>
                </div>
                <div class="table-scroll">
                    <table class="data-table record-table">
                        <thead>
                            <tr>
                                <th class="col-actions">操作</th>
                                <th class="col-index">序号</th>
                                <th>原始记录名称</th>
                                <th>模板名称</th>
                                <th>记录生成方式</th>
                                <th>样品类别</th>
                                <th>所属部门</th>
                                <th>仪器设备</th>
                                <th>样品数量</th>
                                <th>项目数量</th>
                                <th>实验时间范围</th>
                                <th>生成时间</th>
                                <th>生成人</th>
                            </tr>
                        </thead>
                        <tbody id="recordRows"></tbody>
                    </table>
                    <div id="recordEmpty" class="table-state is-hidden">暂无符合条件的原始记录</div>
                </div>
                <div class="pagination"><button id="recordPrevious" class="page-button" type="button">‹</button>
                    <div id="recordPages" class="page-numbers"></div><button id="recordNext" class="page-button"
                        type="button">›</button><span id="recordPageSummary">共 0 页，10 条</span><label
                        for="recordJump">跳至</label><input id="recordJump" class="jump-input" type="number"
                        min="1"><span>页</span>
                </div>
            </section>
        </section>
    </main>
    <div id="businessModal" class="modal-mask is-hidden" role="dialog" aria-modal="true">
        <div class="modal-box">
            <header class="modal-header">
                <h2 id="modalTitle">详情</h2><button id="modalClose" type="button" aria-label="关闭">×</button>
            </header>
            <div id="modalBody" class="modal-body"></div>
            <footer id="modalFooter" class="modal-footer"></footer>
        </div>
    </div>
    <div id="toast" class="toast is-hidden"></div>
    <script src="{% static 'ynjksys/syssjcj_sbsj_list.js' %}?v=2026080410"></script>
</body>

</html>
