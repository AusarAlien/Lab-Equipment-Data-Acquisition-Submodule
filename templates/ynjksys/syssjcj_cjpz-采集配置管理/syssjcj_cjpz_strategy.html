{% load static %}<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>采集策略</title>
    <link
      rel="stylesheet"
      href="{% static 'ynjksys/syssjcj_cjpz_modal.css' %}?v=2026081002"
    />
    <script src="{% static 'common/isvar.js' %}"></script>
    <script src="{% static 'common/isloadpage.js' %}"></script>
    <script src="{% static 'ynjksys/syssjcj_mock_data.js' %}?v=2026080413"></script>
    <script src="{% static 'ynjksys/syssjcj_cjpz_service.js' %}?v=2026080401"></script>
  </head>
  <body>
    <main class="modal-page">
      <nav class="subtabs">
        <button class="subtab is-active" data-tab="basic">基本信息</button
        ><button class="subtab" data-tab="rule">采集规则</button>
        <!-- 当前 HTTP 采集由客户端执行文件追踪、服务端自动归档，不开放归档规则配置。
        <button class="subtab" data-tab="archive">归档规则</button>
        -->
        <!-- 当前阶段隐藏脚本功能，具备在线脚本管理前提后恢复。
        <button class="subtab" data-tab="script">关联脚本</button>
        -->
      </nav>
      <section id="basicPanel" class="card">
        <div class="card-title"><h1>策略基本信息</h1></div>
        <div class="card-body form-grid">
          <div class="form-item">
            <label class="required">策略名称</label
            ><input
              id="strategyName"
              placeholder="如：安捷伦1200液相色谱仪-HTTP目录采集策略"
              title="平台侧业务名称，用于查询和审计"
            />
          </div>
          <div class="form-item">
            <label>策略编号</label><input id="strategyId" disabled />
          </div>
          <div class="field-help form-item full">
            策略名称由平台维护，仅用于页面识别、查询和审计；修改名称不会触发客户端重新应用配置。
          </div>
          <div class="form-item">
            <label class="required">所属实验室</label
            ><select id="departmentId"></select>
          </div>
          <div class="form-item">
            <label class="required">仪器设备</label
            ><select id="deviceId"></select>
          </div>
          <div class="form-item">
            <label class="required">采集客户端</label
            ><select id="clientId"></select>
          </div>
          <div class="form-item">
            <label>仪器编号</label><input id="instno" disabled />
          </div>
          <div class="form-item">
            <label class="required">采集方式</label
            ><select id="collectionMode">
              <option>HTTP文件夹监听</option>
              <option>USB存储采集</option>
              <option>串口采集</option>
            </select>
          </div>
          <div class="form-item">
            <label>策略状态</label
            ><select id="status">
              <option>启用</option>
              <option>停用</option>
            </select>
          </div>
          <div class="form-item">
            <label>策略版本</label><input id="version" disabled />
          </div>
          <div class="form-item">
            <label>配置人员</label><input id="owner" disabled />
          </div>
        </div>
      </section>
      <section id="rulePanel" class="card is-hidden">
        <div class="card-title"><h1>客户端采集规则</h1></div>
        <div class="card-body form-grid">
          <div class="form-item">
            <label>接口类型</label
            ><select id="interfaceType">
              <option value="http">HTTP</option>
              <option value="usb">USB</option>
              <option value="serial">串口</option>
            </select>
          </div>
          <div class="form-item">
            <label>监听目录</label><input id="filepath" />
          </div>
          <div class="form-item">
            <label>扫描间隔（秒）</label
            ><input id="frequency" type="number" min="1" />
          </div>
          <div class="form-item">
            <label>服务标识</label><input id="service" />
          </div>
          <div class="form-item">
            <label>起始数据行</label
            ><input id="startrow" type="number" min="1" />
          </div>
          <div class="form-item">
            <label>样品列标识</label><input id="sampcolflag" />
          </div>
          <div class="form-item">
            <label>文件处理追踪</label
            ><select id="trackMode" disabled>
              <option>启用</option>
            </select>
          </div>
          <div class="form-item">
            <label>心跳间隔（秒）</label
            ><input id="heartbeatInterval" type="number" min="10" />
          </div>
          <div id="usbFields" class="form-item full is-hidden">
            <div class="form-grid" style="width: 100%">
              <div class="form-item">
                <label>USB模式</label
                ><select id="usbMode">
                  <option value="mass_storage">大容量存储</option>
                  <option value="serial_port">串口设备</option>
                </select>
              </div>
              <div class="form-item">
                <label>USB扫描间隔</label
                ><input id="usbPollInterval" type="number" min="1" />
              </div>
            </div>
          </div>
          <div id="serialFields" class="form-item full is-hidden">
            <div class="form-grid" style="width: 100%">
              <div class="form-item">
                <label>COM端口</label
                ><input id="comPort" placeholder="如 COM3" />
              </div>
              <div class="form-item">
                <label>波特率</label><input id="comBaudrate" type="number" />
              </div>
              <div class="form-item">
                <label>数据位</label><input id="comBytesize" type="number" />
              </div>
              <div class="form-item">
                <label>停止位</label><input id="comStopbits" type="number" />
              </div>
              <div class="form-item">
                <label>校验位</label
                ><select id="comParity">
                  <option>N</option>
                  <option>E</option>
                  <option>O</option>
                </select>
              </div>
              <div class="form-item">
                <label>超时时间</label><input id="comTimeout" type="number" />
              </div>
            </div>
          </div>
          <div class="readonly-note form-item full">
            上传成功后写入客户端处理记录，防止同一文件重复上传；源文件保持在监听目录，服务端归档由系统自动完成。
          </div>
        </div>
      </section>
      <!-- 当前阶段隐藏归档规则：HTTP 客户端不执行本地文件归档，服务端接收后自动写入平台文件库。
      <section id="archivePanel" class="card is-hidden">
        <div class="card-title"><h1>采集归档规则</h1></div>
        <div class="card-body form-grid">
          <div class="form-item">
            <label>归档方式</label
            ><select id="archiveMode">
              <option>上传成功后记录追踪</option>
              <option>本地复制后上传</option>
              <option>仅生成本地文件</option>
            </select>
          </div>
          <div class="form-item">
            <label>数据模式</label
            ><select id="dataMode">
              <option value="file_first">文件优先</option>
              <option value="data_first">数据优先</option>
            </select>
          </div>
          <div class="form-item full">
            <label>输出目录</label><input id="outputDir" />
          </div>
          <div class="form-item full">
            <label>文件命名规则</label><input id="filenameTemplate" />
          </div>
        </div>
      </section>
      -->
      <!-- 当前阶段隐藏关联脚本及调试入口，页面结构保留供后续恢复。
      <section id="scriptPanel" class="card is-hidden">
        <div class="card-title"><h1>关联脚本</h1></div>
        <div class="card-body">
          <div id="scriptInfo" class="info-grid"></div>
          <div style="text-align: right; margin-top: 18px">
            <button id="openScript" class="button button-primary">
              查看及调试脚本
            </button>
          </div>
        </div>
      </section>
      -->
      <footer class="toolbar">
        <button id="download" class="button">下载配置</button
        ><button id="edit" class="button">进入修改</button
        ><button id="cancelEdit" class="button is-hidden">取消修改</button
        ><button id="save" class="button button-primary is-hidden">保存</button>
      </footer>
    </main>
    <div id="toast" class="toast is-hidden"></div>
    <script src="{% static 'ynjksys/syssjcj_cjpz_strategy.js' %}?v=2026081002"></script>
  </body>
</html>
