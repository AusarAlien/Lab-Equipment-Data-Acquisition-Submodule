{% load static %}
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>生成原始记录</title>
    <link
      rel="stylesheet"
      href="{% static 'ynjksys/syssjcj_sbsj_record_generate.css' %}?v=2026080603"
    />
    <script src="{% static 'common/isvar.js' %}"></script>
    <script src="{% static 'common/isqrydata.js' %}"></script>
    <script src="{% static 'common/issubmit.js' %}"></script>
    <script src="{% static 'ynjksys/syssjcj_mock_data.js' %}?v=2026080410"></script>
  </head>

  <body>
    <main id="pageContent" class="page-container">
      <section class="config-panel">
        <div class="section-title">
          <span></span>
          <h1>原始记录生成信息</h1>
        </div>
        <div class="config-grid">
          <div class="form-item form-wide">
            <label for="recordName">原始记录名称</label
            ><input id="recordName" type="text" maxlength="120" />
          </div>
          <div class="form-item">
            <label for="sampleCategorySelect">样品类别</label
            ><select id="sampleCategorySelect">
              <option value="">请选择样品类别</option>
            </select>
          </div>
          <div class="form-item">
            <label for="templateSelect">原始记录模板</label
            ><select id="templateSelect" disabled>
              <option value="">请先选择样品类别</option>
            </select>
          </div>
          <div class="form-item">
            <label for="recordModeSelect">记录生成方式</label
            ><select id="recordModeSelect" disabled>
              <option value="">请先选择原始记录模板</option>
            </select>
          </div>
          <div class="info-item">
            <span>所属部门</span><strong id="departmentName">--</strong>
          </div>
          <div class="info-item">
            <span>仪器设备</span><strong id="deviceName">--</strong>
          </div>
          <div class="info-item">
            <span>实验时间</span><strong id="experimentRange">--</strong>
          </div>
          <div class="info-item">
            <span>数据数量</span><strong id="dataCount">--</strong>
          </div>
          <div id="constraintMessage" class="constraint-message form-span-all">
            请选择样品类别和原始记录模板，系统将校验所选数据是否符合模板组织规则。
          </div>
        </div>
      </section>
      <section class="preview-panel">
        <div class="section-title">
          <span></span>
          <h1>标准模板原始记录预览</h1>
        </div>
        <article class="record-paper">
          <div id="templateHeader" class="template-region template-header"></div>
          <header>
            <h2 id="paperTitle">原始记录</h2>
            <div id="paperDescription" class="template-description"></div>
            <div class="paper-code">记录编号：系统生成</div>
          </header>
          <div id="paperMeta" class="paper-meta">
            <div>所属部门：<strong id="paperDepartment">--</strong></div>
            <div>仪器设备：<strong id="paperDevice">--</strong></div>
            <div>品牌型号：<strong id="paperModel">--</strong></div>
            <div>固定资产编号：<strong id="paperAsset">--</strong></div>
            <div>实验时间：<strong id="paperTime">--</strong></div>
            <div>记录模板：<strong id="paperTemplate">--</strong></div>
            <div>样品类别：<strong id="paperSampleCategory">--</strong></div>
          </div>
          <div class="paper-table-scroll">
            <table>
              <thead>
                <tr id="previewHead"></tr>
              </thead>
              <tbody id="previewRows"></tbody>
            </table>
          </div>
          <div id="templateNotes" class="template-region template-notes"></div>
          <div id="templateSignature" class="template-region template-signature"></div>
          <footer id="templateFooter">
            <span>记录生成：监*一</span><span>生成时间：系统生成</span
            ><span>复核：________</span>
          </footer>
        </article>
      </section>
      <div class="page-actions">
        <button id="generateSubmit" class="button button-primary" type="button">
          生成原始记录
        </button>
      </div>
    </main>
    <div id="pageError" class="page-error is-hidden">
      生成数据不存在或已失效
    </div>
    <div id="workingMask" class="working-mask is-hidden">
      <div class="working-box">
        <span class="spinner"></span><strong>正在生成标准原始记录</strong>
      </div>
    </div>
    <div id="toast" class="toast is-hidden"></div>
    <script src="{% static 'ynjksys/syssjcj_sbsj_record_generate.js' %}?v=2026080604"></script>
  </body>
</html>
