[interface]
type = http
instno = ICPMS
# [2026-07-15] 测试配置：原值 C:\Tomcat 9\logs，改为测试监听目录
#filepath = C:\Tomcat 9\logs
filepath = D:\Desktop\仪器文件扫描上传测试包\watch_dir
# [2026-07-15] 测试配置：原值 20，改为5秒以加速测试
frequency = 5
# [2026-07-15] 测试配置：原值 http://200.100.100.53:8897/smapp，改为本地 Mock 服务器
# service = http://127.0.0.1:8897/mock
service = http://200.100.100.53:8897/smapp
startrow = 1
sampcolflag = 样品名称
backup = 1
# [2026-07-15] 新增：1=原地追踪模式(文件不移动)，0或不配置=原有备份删除模式
track_mode = 1

# ── [2026-07-15] USB 接口配置 ──
# USB 子类型: mass_storage(大容量存储) / serial_port(串口) / auto(自动检测)
usb_mode = mass_storage

# ── USB-Storage 专用 ──
# 监听哪些盘符（逗号分隔），为空则自动检测所有新挂载的可移动磁盘
usb_drive_letters =
# U盘扫描间隔（秒）
usb_poll_interval = 5
# 扫描到的文件复制到本地目录（留空则直接在U盘上读取）
usb_local_copy_dir =

# ── USB-Serial 专用 ──
# COM端口号，Windows 下如 COM3
com_port = COM3
# 波特率: 9600, 19200, 38400, 115200
com_baudrate = 9600
# 数据位: 7, 8
com_bytesize = 8
# 停止位: 1, 2
com_stopbits = 1
# 校验位: N(无) / E(偶) / O(奇)
com_parity = N
# 超时（秒），0=永不超时
com_timeout = 0
# 行结束符（文本模式），\\r\\n 表示回车换行
com_line_terminator = \\r\\n

# ── 数据处理 ──
# 数据去向: file_first(先存文件再上传) / direct(直推服务端)
data_mode = file_first
# 存文件时的输出目录（空=系统临时目录）
usb_output_dir =
# 文件名模板
usb_filename_template = {instno}_{datetime}_{seq}.csv

# ── 流格式 ──
# 流格式: text_line(文本行) / binary_frame(二进制帧)
stream_format = text_line
# 二进制帧：帧头 hex（如 AA55）
frame_header =
# 二进制帧：帧尾 hex（如 55AA）
frame_footer =
# 二进制帧：固定帧长度（字节），0=按帧头帧尾分割
frame_length = 0

# 客户端运行接口；client_secret仅保存于设备本机，不提交版本库真实值
client_id = ICPMS
client_type = python
client_ver = v2_20260810
lab_id =
heartbeat_interval = 60
client_api_enabled = 1
# 凭证功能停用；以下配置保留为注释，当前运行不要求填写。
# auth_key_id =
# client_secret =
config_pull_interval = 300

[remote_policy]
current_version =
current_hash =

